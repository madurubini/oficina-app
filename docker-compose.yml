services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oficina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficina}
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
    ports:
      # 5433 no host: a 5432 já é usada por outro container na máquina.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - oficina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-oficina} -d ${POSTGRES_DB:-oficina}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-app
    depends_on:
      db:
        condition: service_healthy
    # Aplica migrations e seed antes de iniciar a API (no Kubernetes, é um Job).
    entrypoint: ['./docker-entrypoint.sh']
    environment:
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-oficina}:${POSTGRES_PASSWORD:-oficina}@db:5432/${POSTGRES_DB:-oficina}?schema=public'
      PORT: '3000'
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-segredo-de-desenvolvimento-nao-use-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600s}
      # New Relic desligado por padrão. Para testar com a sua conta, crie um
      # .env (fora do git) com NEW_RELIC_ENABLED=true e NEW_RELIC_LICENSE_KEY.
      NEW_RELIC_ENABLED: ${NEW_RELIC_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-oficina-api-local}
      NEW_RELIC_ERROR_COLLECTOR_IGNORE_ERROR_CODES: '400-499'
      SIMULAR_FALHA_NOTIFICACAO: ${SIMULAR_FALHA_NOTIFICACAO:-false}
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      # Usa o fetch nativo do Node 20 (a imagem slim não tem curl/wget).
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  oficina-pgdata:
