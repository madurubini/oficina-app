# Produção: namespace prod e schema prod no RDS (via Secret criado pelo
# pipeline). Réplicas e HPA seguem a base (2 a 10).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

# O pipeline reescreve newName/newTag com o ECR e o SHA do commit.
images:
  - name: oficina-api
    newName: oficina-api
    newTag: local

patches:
  - target:
      kind: ConfigMap
      name: oficina-config
    patch: |-
      - op: replace
        path: /data/NEW_RELIC_APP_NAME
        value: oficina-api-prod
