# Migra o banco uma vez, antes da API subir. Fora do start da aplicação porque
# as réplicas criadas pelo HPA migrariam o mesmo banco simultaneamente.
# O schema (homolog ou prod) vem da DATABASE_URL do Secret; o Prisma o cria se
# ainda não existir. Se o RDS ainda não aceita conexão, o backoffLimit tenta de novo.
apiVersion: batch/v1
kind: Job
metadata:
  name: migracoes
  labels:
    app.kubernetes.io/name: migracoes
    app.kubernetes.io/part-of: oficina
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migracoes
    spec:
      restartPolicy: Never
      containers:
        - name: migracoes
          image: oficina-api
          command:
            - sh
            - -c
            - 'npx prisma migrate deploy && node dist/prisma/seed.js'
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
