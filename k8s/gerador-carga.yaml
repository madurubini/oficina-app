# Só para a demonstração do HPA. Aplique no namespace do ambiente, observe as
# réplicas subirem e remova:
#   make carga NAMESPACE=prod / make sem-carga NAMESPACE=prod
apiVersion: v1
kind: Pod
metadata:
  name: gerador-carga
  labels:
    app.kubernetes.io/name: gerador-carga
spec:
  restartPolicy: Never
  containers:
    - name: carga
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 20); do
            while true; do
              wget -q -O /dev/null http://oficina-api/api/v1/health/ready || true
            done &
          done
          wait
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 300m
          memory: 64Mi
