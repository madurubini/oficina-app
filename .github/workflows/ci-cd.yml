# Pipeline da aplicação.
#
# - Pull request (para homolog ou main): build e testes. É o check obrigatório
#   da ruleset: sem ele verde, o merge fica bloqueado.
# - Push em homolog: testes → imagem no ECR → deploy no namespace homolog.
# - Push em main: o mesmo, no namespace prod.
#
# Os dois ambientes vivem no mesmo cluster EKS (repo oficina-infra-k8s) e no
# mesmo RDS (repo oficina-infra-db), separados por namespace e por schema.
# Os dois precisam estar no ar antes do deploy (ordem: ① → ② → ③).
name: CI/CD

on:
  pull_request:
    branches: [homolog, main]
  push:
    branches: [homolog, main]
  workflow_dispatch:

# Dois deploys no mesmo ambiente ao mesmo tempo disputariam o Job de migrations.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Nomes criados pelos repos de infraestrutura.
  CLUSTER: oficina-eks
  ECR_REPOSITORIO: oficina-app
  RDS_IDENTIFICADOR: oficina-db
  # Chart da integração Kubernetes do New Relic (versão fixa: deploy repetível).
  NRI_BUNDLE_VERSAO: 8.0.34

permissions:
  contents: read

jobs:
  qualidade:
    name: Build e testes
    runs-on: ubuntu-latest

    # Os e2e da Ordem de Serviço rodam contra um Postgres real (fazem db push e
    # exercitam o gateway Prisma).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina
          POSTGRES_DB: oficina_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build da aplicação
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

      - name: Testes end-to-end
        env:
          DATABASE_URL_E2E: postgresql://oficina:oficina@localhost:5433/oficina_e2e?schema=public
        run: npm run test:e2e

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: qualidade
    if: github.event_name == 'push'
    # O environment registra cada deploy na aba "Deployments" do repositório.
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homolog' }}
    env:
      # O namespace dá nome ao overlay do Kustomize e ao schema do banco.
      NAMESPACE: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais da AWS (sessão do Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # A tag é o SHA do commit: cada deploy aponta para uma imagem diferente,
      # então o rollout sempre troca os pods e dá para saber o que está no ar.
      - name: Build e push da imagem
        id: imagem
        run: |
          IMAGEM="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORIO:$GITHUB_SHA"
          docker build -t "$IMAGEM" .
          docker push "$IMAGEM"
          echo "nome=$IMAGEM" >> "$GITHUB_OUTPUT"

      - name: Apontar o kubectl para o cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER"

      # O Secret nasce aqui, e não num arquivo do repo: a senha do banco e o
      # segredo do JWT ficam só nos Secrets do GitHub. Endereço, usuário e nome
      # do banco são lidos do próprio RDS, sem copiar nada à mão do repo ②.
      - name: Namespace e Secret do ambiente
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          GESTOR_SENHA: ${{ secrets.GESTOR_SENHA }}
        run: |
          # Sem o secret, o seed pararia o Job de migrações: falha aqui, com a causa clara.
          if [ -z "$GESTOR_SENHA" ]; then
            echo "::error::Cadastre o secret GESTOR_SENHA (senha do gestor criado pelo seed)."
            exit 1
          fi

          read -r DB_HOST DB_PORTA DB_USUARIO DB_NOME <<< "$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_IDENTIFICADOR" \
            --query 'DBInstances[0].[Endpoint.Address,Endpoint.Port,MasterUsername,DBName]' \
            --output text)"

          # Caracteres especiais na senha quebrariam a URL; @uri os escapa.
          SENHA=$(jq -rn --arg s "$DB_PASSWORD" '$s|@uri')
          echo "::add-mask::$SENHA"
          DATABASE_URL="postgresql://$DB_USUARIO:$SENHA@$DB_HOST:$DB_PORTA/$DB_NOME?schema=$NAMESPACE"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic oficina-secrets -n "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --from-literal=SEED_GESTOR_SENHA="$GESTOR_SENHA" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Integração Kubernetes do New Relic: CPU/memória de nós e pods, estado
      # dos objetos (kube-state-metrics) e eventos do cluster. É do cluster, não
      # do ambiente, então os dois deploys aplicam o mesmo release (idempotente).
      # Logs ficam com o agente da aplicação; Prometheus e Pixie, desligados para
      # caber nos 2 nós.
      - name: Integração Kubernetes (New Relic)
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          helm repo add newrelic https://helm-charts.newrelic.com
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --version "$NRI_BUNDLE_VERSAO" \
            --namespace newrelic --create-namespace \
            --set global.licenseKey="$NEW_RELIC_LICENSE_KEY" \
            --set global.cluster="$CLUSTER" \
            --set global.lowDataMode=true \
            --set kube-state-metrics.enabled=true \
            --set nri-kube-events.enabled=true \
            --set nri-metadata-injection.enabled=false \
            --set newrelic-prometheus-agent.enabled=false \
            --set newrelic-logging.enabled=false \
            --set newrelic-pixie.enabled=false \
            --set k8s-agents-operator.enabled=false \
            --wait --timeout 5m

      - name: Aplicar os manifestos
        run: |
          cd "k8s/overlays/$NAMESPACE"
          kustomize edit set image "oficina-api=${{ steps.imagem.outputs.nome }}"
          # Os campos de um Job concluído são imutáveis: recria a cada deploy.
          kubectl delete job migracoes -n "$NAMESPACE" --ignore-not-found
          kubectl apply -k .

      - name: Aguardar as migrations
        run: |
          kubectl wait --for=condition=complete job/migracoes \
            -n "$NAMESPACE" --timeout=300s
          kubectl logs job/migracoes -n "$NAMESPACE" --tail=20

      - name: Aguardar a API entrar no ar
        run: |
          kubectl rollout status deployment/oficina-api \
            -n "$NAMESPACE" --timeout=300s

      # Na primeira vez o Load Balancer leva alguns minutos para ganhar endereço
      # e o DNS dele mais um pouco para propagar; daí as esperas em laço.
      - name: Smoke test pelo Load Balancer
        env:
          GESTOR_SENHA: ${{ secrets.GESTOR_SENHA }}
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc oficina-api -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            echo "Load Balancer ainda sem endereço; aguardando..."
            sleep 10
          done
          URL="http://$HOST"
          echo "API em $URL"

          for i in $(seq 1 30); do
            curl -fsS "$URL/api/v1/health/ready" > ready.json 2>/dev/null && break
            echo "Load Balancer ainda não responde; aguardando..."
            sleep 10
          done
          cat ready.json
          grep -q '"database":{"status":"up"}' ready.json

          curl -fsS -X POST "$URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg s "$GESTOR_SENHA" '{username: "gestor", senha: $s}')" \
            | grep -q accessToken

          {
            echo "### Deploy em \`$NAMESPACE\`"
            echo "- Imagem: \`${{ steps.imagem.outputs.nome }}\`"
            echo "- Swagger: $URL/api/docs"
            echo "- Saúde: $URL/api/v1/health/ready"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Estado final do namespace
        if: always()
        run: |
          kubectl get all,configmap,secret -n "$NAMESPACE" || true
          kubectl describe hpa oficina-api -n "$NAMESPACE" || true
